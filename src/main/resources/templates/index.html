<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${tituloPagina}">AutoParts - Peças Automotivas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- CABEÇALHO -->
    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <main id="conteudo">
    
        <!-- BANNER PRINCIPAL -->
        <section class="banner">

            <div class="banner-conteudo">

                <h1>
                    <span th:text="${tituloPrincipal}">ENCONTRE A PEÇA</span><br>
                    <span>PARA SEU CARRO</span>
                </h1>

                <form th:action="@{/pecas}" method="get" role="search" class="barra-pesquisa">
                    <img th:src="@{/imagens/LupaCentral.png}" alt="">
                    <label for="busca-home" class="sr-only">Pesquisar peças</label>
                    <input type="search" id="busca-home" name="busca" placeholder="Pesquisar peças...">
                </form>

            </div>

        </section>


        <!-- CATEGORIAS -->
        <section class="secao">

            <h2>Categorias</h2>

            <div class="categorias">

                <a class="categoria" th:href="@{/pecas(categoria='Motor')}">
                    <img th:src="@{/imagens/DesenhoMotor.png}" alt="">
                    <h3>Motor</h3>
                </a>

                <a class="categoria" th:href="@{/pecas(categoria='Freios')}">
                    <img th:src="@{/imagens/DesenhoFreios.png}" alt="">
                    <h3>Freios</h3>
                </a>

                <a class="categoria" th:href="@{/pecas(categoria='Suspensão')}">
                    <img th:src="@{/imagens/DesenhoSuspensao.png}" alt="">
                    <h3>Suspensão</h3>
                </a>

                <a class="categoria" th:href="@{/pecas(categoria='Elétrica')}">
                    <img th:src="@{/imagens/DesenhoEletrica.png}" alt="">
                    <h3>Elétrica</h3>
                </a>

            </div>

        </section>


        <!-- PEÇAS EM DESTAQUE -->
        <section class="secao">

            <h2>Peças em destaque</h2>

            <div class="produtos">

                <a class="produto" th:each="peca : ${pecas}" th:href="@{/pecas/detalhe/{id}(id=${peca.id})}">

                    <div class="etiqueta" th:text="${peca.categoria}">
                        Peça
                    </div>

                    <div class="produto-imagem">
                        <img th:if="${!#strings.isEmpty(peca.imagem)}" th:src="@{${peca.imagem}}" th:alt="${peca.nome}">
                        <span th:if="${#strings.isEmpty(peca.imagem)}">Imagem</span>
                    </div>

                    <h3 th:text="${peca.nome}">
                        Nome da peça
                    </h3>

                    <p class="preco">
                        R$ <span th:text="${#numbers.formatDecimal(peca.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                    </p>

                </a>

            </div>

        </section>
    </main>

    <!-- RODAPÉ -->
    <footer th:replace="~{fragmentos :: rodape}"></footer>

</body>

</html>
