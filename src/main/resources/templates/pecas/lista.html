<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Peças - AutoParts</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header>
            <h1>Catálogo de Peças</h1>

            <div sec:authorize="isAuthenticated()">
                <span>Olá, <span sec:authentication="name">usuário</span></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Sair</button>
                </form>
            </div>

            <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Entrar</a>
        </header>

        <main class="secao">
            <!--Esse link leva pro /pecas/nova — que bate com o @GetMapping("/pecas/nova") do seu Controller, 
            abrindo o formulário vazio.-->
            <a th:href="@{/pecas/nova}" class="btn-novo" sec:authorize="hasRole('ADMIN')">+ Nova Peça</a>

            <!-- buscar não altera dados: GET deixa a busca na URL -->
            <form th:action="@{/pecas}" method="get" role="search" class="filtros">
                <label for="busca">Pesquisar</label>
                <input type="search" id="busca" name="busca" th:value="${busca}">

                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
                            th:selected="${c == categoriaSelecionada}">Motor</option>
                </select>

                <label for="marca">Marca</label>
                <select id="marca" name="marca">
                    <option value="">Todas</option>
                    <option th:each="m : ${marcas}" th:value="${m}" th:text="${m}"
                            th:selected="${m == marcaSelecionada}">Bosch</option>
                </select>

                <label for="precoMax">Preço máximo (R$)</label>
                <input type="number" id="precoMax" name="precoMax" min="0" step="0.01" th:value="${precoMax}">

                <button type="submit">Buscar</button>
            </form>

            <p th:if="${#lists.isEmpty(pecas)}">Nenhuma peça encontrada</p>

            <div class="produtos" th:unless="${#lists.isEmpty(pecas)}">
                <!-- cada card leva para o detalhe da peça -->
                <a class="produto" th:each="peca : ${pecas}"
                   th:href="@{/pecas/detalhe/{id}(id=${peca.id})}">

                    <div class="etiqueta" th:text="${peca.categoria}">Peça</div>

                    <div class="produto-imagem">
                        <img th:if="${!#strings.isEmpty(peca.imagem)}"
                             th:src="@{${peca.imagem}}" th:alt="${peca.nome}">
                        <span th:if="${#strings.isEmpty(peca.imagem)}">Imagem</span>
                    </div>

                    <h3 th:text="${peca.nome}">Nome da peça</h3>

                    <p class="preco">
                        R$ <span th:text="${#numbers.formatDecimal(peca.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                    </p>
                </a>
            </div>
        </main>
    </body>
</html>
