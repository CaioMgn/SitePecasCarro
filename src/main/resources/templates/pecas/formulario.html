<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${peca.id == null} ? 'Cadastro de Peça - AutoParts' : 'Editar Peça - AutoParts'">
        Cadastro de Peça - AutoParts
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <main id="conteudo" class="formulario-pagina">

        <div class="formulario-cabecalho">
            <a th:href="@{/admin/produtos}" class="formulario-voltar">
                ← Voltar para produtos
            </a>

            <h1 th:text="${peca.id == null} ? 'Cadastrar peça' : 'Editar peça'">
                Cadastrar peça
            </h1>

            <p>
                Preencha os dados abaixo para cadastrar ou atualizar uma peça.
            </p>
        </div>

        <section class="formulario-card">

            <div class="formulario-card-titulo">
                <h2>Informações da peça</h2>
                <p>Os dados cadastrados serão utilizados no catálogo da AutoParts.</p>
            </div>

            <form th:action="@{/pecas/salvar}"
                  th:object="${peca}"
                  method="post"
                  class="formulario-peca">

                <div th:if="${#fields.hasErrors('*')}" class="mensagens-erro" role="alert">
                    <p>Não foi possível salvar a peça. Corrija os seguintes problemas:</p>
                    <ul>
                        <li th:each="erro : ${#fields.errors('*')}"
                            th:text="${erro}">
                            Mensagem de erro
                        </li>
                    </ul>
                </div>

                <input type="hidden" th:field="*{id}">

                <div class="formulario-campos">

                    <div class="campo-formulario">
                        <label for="nome">Nome da peça</label>
                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('nome')}"
                               aria-describedby="erro-nome"
                               required>

                        <p id="erro-nome"
                           th:if="${#fields.hasErrors('nome')}"
                           th:errors="*{nome}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="categoria">Categoria</label>
                        <select id="categoria"
                                th:field="*{categoria}"
                                th:errorclass="campo-invalido"
                                th:attr="aria-invalid=${#fields.hasErrors('categoria')}"
                                aria-describedby="erro-categoria"
                                required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Motor">Motor</option>
                            <option value="Freios">Freio</option>
                            <option value="Suspensão">Suspensão</option>
                            <option value="Elétrica">Elétrica</option>
                        </select>

                        <p id="erro-categoria"
                           th:if="${#fields.hasErrors('categoria')}"
                           th:errors="*{categoria}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="preco">Preço (R$)</label>
                        <input type="number"
                               id="preco"
                               step="0.01"
                               min="0.01"
                               th:field="*{preco}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('preco')}"
                               aria-describedby="erro-preco"
                               placeholder="Ex.: 149.90"
                               required>

                        <p id="erro-preco"
                           th:if="${#fields.hasErrors('preco')}"
                           th:errors="*{preco}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="marca">Marca</label>
                        <input type="text"
                               id="marca"
                               th:field="*{marca}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('marca')}"
                               aria-describedby="erro-marca"
                               required>

                        <p id="erro-marca"
                           th:if="${#fields.hasErrors('marca')}"
                           th:errors="*{marca}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario campo-largura-total">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao"
                                  th:field="*{descricao}"
                                  th:errorclass="campo-invalido"
                                  th:attr="aria-invalid=${#fields.hasErrors('descricao')}"
                                  aria-describedby="erro-descricao"
                                  rows="4"
                                  required></textarea>

                        <p id="erro-descricao"
                           th:if="${#fields.hasErrors('descricao')}"
                           th:errors="*{descricao}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario campo-largura-total">
                        <label for="compatibilidade">Compatibilidade</label>
                        <input type="text"
                               id="compatibilidade"
                               th:field="*{compatibilidade}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('compatibilidade')}"
                               aria-describedby="erro-compatibilidade"
                               placeholder="Ex.: Volkswagen Gol 1.6, 2018–2022"
                               required>

                        <p id="erro-compatibilidade"
                           th:if="${#fields.hasErrors('compatibilidade')}"
                           th:errors="*{compatibilidade}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="estoque">Quantidade em estoque</label>
                        <input type="number"
                               id="estoque"
                               min="0"
                               th:field="*{estoque}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('estoque')}"
                               aria-describedby="erro-estoque"
                               required>

                        <p id="erro-estoque"
                           th:if="${#fields.hasErrors('estoque')}"
                           th:errors="*{estoque}"
                           class="erro-campo"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="imagem">Caminho da imagem</label>
                        <input type="text"
                               id="imagem"
                               th:field="*{imagem}"
                               th:errorclass="campo-invalido"
                               th:attr="aria-invalid=${#fields.hasErrors('imagem')}"
                               aria-describedby="erro-imagem"
                               placeholder="/imagens/pecas/alternador.png"
                               required>

                        <p id="erro-imagem"
                           th:if="${#fields.hasErrors('imagem')}"
                           th:errors="*{imagem}"
                           class="erro-campo"></p>
                    </div>

                </div>

                <div class="formulario-acoes">
                    <a th:href="@{/admin/produtos}" class="botao-cancelar-formulario">
                        Cancelar
                    </a>

                    <button type="submit" class="botao-salvar-formulario">
                        Salvar peça
                    </button>
                </div>

            </form>

        </section>

    </main>

    <footer th:replace="~{fragmentos :: rodape}"></footer>

</body>
</html>
