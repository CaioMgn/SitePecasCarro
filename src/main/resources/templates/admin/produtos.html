<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Produtos - AutoParts</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <div class="layout-admin">

        <nav th:replace="~{admin/menu :: menu('produtos')}"></nav>

        <main id="conteudo" class="painel-admin">

            <div class="produtos-cabecalho">
                <div>
                    <h1 class="produtos-titulo">Gerenciar produtos</h1>
                    <p class="produtos-descricao">
                        Consulte e gerencie as peças cadastradas na AutoParts.
                    </p>
                </div>

                <a th:href="@{/pecas/nova}" class="botao-novo-produto">
                    + Nova peça
                </a>
            </div>

            <section class="produtos-secao">

                <h2>Peças cadastradas</h2>

                <div th:if="${#lists.isEmpty(pecas)}" class="produto-vazio">
                    <p>Nenhuma peça cadastrada.</p>
                    <p>Cadastre uma nova peça para ela aparecer nesta lista.</p>
                </div>

                <div class="tabela-produtos-container"
                     th:unless="${#lists.isEmpty(pecas)}">

                    <table class="tabela-produtos">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Marca</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="peca : ${pecas}">

                                <td class="produto-id" th:text="${peca.id}">1</td>

                                <td th:text="${peca.nome}">Alternador</td>

                                <td th:text="${peca.categoria}">Elétrica</td>

                                <td th:text="${peca.marca}">Bosch</td>

                                <td class="produto-preco">
                                    R$
                                    <span th:text="${#numbers.formatDecimal(peca.preco, 1, 'POINT', 2, 'COMMA')}">
                                        0,00
                                    </span>
                                </td>

                                <td th:text="${peca.estoque}">10</td>

                                <td>
                                    <div class="produto-acoes">

                                        <a th:href="@{/pecas/editar/{id}(id=${peca.id})}"
                                           class="botao-editar-produto">
                                            Editar
                                        </a>

                                        <form th:action="@{/pecas/excluir/{id}(id=${peca.id})}"
                                              method="post">

                                            <button type="submit"
                                                    class="botao-excluir-produto"
                                                    onclick="return confirm('Tem certeza de que deseja excluir esta peça?')">
                                                Excluir
                                            </button>

                                        </form>

                                    </div>
                                </td>

                            </tr>
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <footer th:replace="~{fragmentos :: rodape}"></footer>

</body>
</html>
