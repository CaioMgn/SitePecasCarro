<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Painel AutoParts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <div class="layout-admin">
        <nav th:replace="~{admin/menu :: menu(ativo='clientes')}"></nav>

        <main class="painel-admin">
            <section class="secao clientes-secao">

                <header class="clientes-cabecalho">
                    <h1>Clientes</h1>
                    <p>Histórico resumido dos compradores da loja.</p>
                </header>

                <p class="clientes-vazio"
                   th:if="${#lists.isEmpty(clientes)}">
                    Nenhum cliente cadastrado ainda.
                </p>

                <div class="clientes-tabela-container"
                     th:unless="${#lists.isEmpty(clientes)}">

                    <table class="clientes-tabela">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>E-mail</th>
                                <th>Desde</th>
                                <th>Pedidos</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td class="cliente-nome"
                                    th:text="${cliente.nome}">
                                    Nome do cliente
                                </td>

                                <td class="cliente-email"
                                    th:text="${cliente.email}">
                                    email@exemplo.com
                                </td>

                                <td th:text="${cliente.clienteDesde > 0
                                    ? cliente.clienteDesde : '-'}">
                                    2026
                                </td>

                                <td>
                                    <span class="cliente-total-pedidos"
                                          th:text="${cliente.pedidos}">
                                        0
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </section>
        </main>
    </div>
</body>
</html>
