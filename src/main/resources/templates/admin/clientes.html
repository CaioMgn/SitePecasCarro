<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Painel AutoParts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- ENCAIXE 2: quando o Pedro subir o menu, trocar este <nav> por:
         <nav th:replace="~{admin/menu :: menu('clientes')}"></nav> -->
    <nav class="menu-admin" aria-label="Menu do painel">
        <a th:href="@{/pecas}">Voltar ao catálogo</a>
    </nav>

    <main>
        <h1>Clientes</h1>
        <p>Histórico resumido dos compradores da loja.</p>

        <p th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado ainda.</p>

        <ul class="lista-clientes" th:unless="${#lists.isEmpty(clientes)}">
            <li th:each="cliente : ${clientes}">
                <article class="card-cliente">
                    <h2 th:text="${cliente.nome}">Nome do cliente</h2>
                    <p th:text="${cliente.email}">email@exemplo.com</p>
                    <p th:if="${cliente.clienteDesde > 0}"
                       th:text="|Cliente desde ${cliente.clienteDesde}|">Cliente desde 2026</p>
                    <p th:text="|Pedidos: ${cliente.pedidos}|">Pedidos: 0</p>
                </article>
            </li>
        </ul>
    </main>
</body>
</html>
