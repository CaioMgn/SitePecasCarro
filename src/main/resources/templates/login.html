<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - AutoParts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>



<body>

    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <main id="conteudo" class="pagina-login">
        <section class="card-login" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Entrar na sua conta</h1>
            <p class="subtitulo-login">Acesse para comprar e acompanhar seus pedidos.</p>

            <p class="alerta-erro" role="alert" th:if="${param.error}">
                E-mail ou senha inválidos.
            </p>
            <p class="alerta-info" role="status" th:if="${param.logout}">
                Você saiu da sua conta.
            </p>
            <p class="alerta-info" role="status" th:if="${param.cadastrado}">
                Conta criada! Agora é só entrar.
            </p>

            <form th:action="@{/login}" method="post">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="password"
                       autocomplete="current-password" required>

                <button type="submit">Entrar</button>
            </form>

            <p class="separador">ou</p>

            <a th:href="@{/oauth2/authorization/google}" class="botao-google">
                <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/>
                    <path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.9-6.1z"/>
                    <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
                </svg>
                <span>Entrar com Google</span>
            </a>

            <a th:href="@{/cadastro}" class="botao-secundario">Criar uma conta</a>
        </section>
    </main>

    <footer th:replace="~{fragmentos :: rodape}"></footer>
</body>



</html>
