<!DOCTYPE html>
<html lang="pt-br" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="[suspicious link removed]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header>
        <h1>Cadastro de Usuários</h1>
    </header>

    <main>
        <!-- Bloco para exibir mensagem de erro vinda do Controller/Service -->
        <div th:if="${erro != null}" class="alert-erro" style="color: red; margin-bottom: 15px;">
            <p th:text="${erro}"></p>
        </div>

        <!-- Formulário apontando para a rota de salvar -->
        <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">

            <div>
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00" required>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}" required>
            </div>

            <!-- Seleção de perfil visível apenas para ADMINISTRADORES -->
            <div sec:authorize="hasRole('ADMIN')">
                <label for="role">Tipo de Acesso:</label> 
                <select id="role" th:field="*{role}">
                    <option value="USUARIO">Usuário Comum</option>
                    <option value="ADMIN">Administrador</option>
                </select> 
            </div>            

            <button type="submit">Salvar</button>
        </form>
    </main>

</body>
</html>
