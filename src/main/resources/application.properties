spring.application.name=sitepecascarro

# H2 em modo ARQUIVO (dados persistem entre reinicializacoes)
spring.datasource.url=jdbc:h2:file:./data/autoparts;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Credenciais ficam fora do Git, em segredos.properties
spring.config.import=optional:file:./segredos.properties

# Login com Google (OAuth2)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Envio de e-mail (nota fiscal)
# Usuário e senha de app ficam no segredos.properties (MAIL_USERNAME e MAIL_PASSWORD).
# Sem eles a aplicação sobe normalmente; só o envio da nota falha e vira aviso no log.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
